name: Inspect KFMon
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/NiLuJe/kfmon/tags -q '.[].name' | head -5 || true
          gh api repos/koreader/koreader/releases/latest -q '.tag_name, (.assets[]|.name)' | grep -iE 'v20|kobo' | head -20 || true
          gh api repos/koreader/koreader/releases?per_page=3 -q '.[].tag_name' || true
          gh api repos/pgaskin/NickelMenu/releases -q '.[]|.tag_name' | head -8 || true

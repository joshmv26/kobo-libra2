name: Inspect KFMon
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view -R NiLuJe/kfmon --json tagName,publishedAt,assets -q '.tagName, .publishedAt, (.assets[]|"\(.name) \(.size)")'
          mkdir /tmp/k && cd /tmp/k
          gh release download -R NiLuJe/kfmon --pattern '*.zip' --dir .
          for z in *.zip; do unzip -o "$z"; done
          find . -type f | head -50
          tar tzvf KoboRoot.tgz | head -50

name: Inspect KFMon
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/k && cd /tmp/k
          gh release download -R koreader/koreader --pattern 'koreader-kobo-v*.zip' --dir .
          unzip -l koreader-kobo-*.zip | grep -v 'koreader/' | head -40
          unzip -o -q koreader-kobo-*.zip -d x
          find x -maxdepth 4 -not -path 'x/koreader/*' | head -40
          tar tzvf x/koreader/KoboRoot.tgz 2>/dev/null | head; find x -name '*.tgz' -o -name '*.ini' -o -name '*.png' | head

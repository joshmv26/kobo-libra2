name: Build Libra 2 bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y wget curl git pkg-config unzip jq patchelf zip

      - name: Kobo ARM toolchain (koxtoolchain, old glibc matching Kobo firmware)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p $HOME/toolchain && cd $HOME/toolchain
          gh release view -R koreader/koxtoolchain --json tagName,assets -q '.tagName, (.assets[].name)'
          gh release download -R koreader/koxtoolchain --pattern 'kobo*' --dir .
          ls -la
          for f in kobo*; do case "$f" in *.zip) unzip -q "$f";; *.tar.*|*.tgz) tar xf "$f";; esac; done
          GCC=$(find $HOME/toolchain -name 'arm-kobo-linux-gnueabihf-gcc' -type f -o -name 'arm-kobo-linux-gnueabihf-gcc' -type l | head -1)
          echo "gcc found: $GCC"
          BIN=$(dirname "$GCC")
          mkdir -p $HOME/toolchain/shim
          for t in "$BIN"/arm-kobo-linux-gnueabihf-*; do
            n=$(basename "$t"); ln -sf "$t" "$HOME/toolchain/shim/arm-linux-gnueabihf-${n#arm-kobo-linux-gnueabihf-}"
          done
          echo "$BIN" >> $GITHUB_PATH
          echo "$HOME/toolchain/shim" >> $GITHUB_PATH

      - name: Rust target
        run: rustup target add arm-unknown-linux-gnueabihf

      - name: getauxval shim (old sysroot lacks it)
        run: |
          arm-linux-gnueabihf-gcc -c -O2 -fPIC -o $HOME/getauxval.o contrib/getauxval_shim.c
          echo "RUSTFLAGS=-C target-feature=+v7,+vfp3,+neon -C link-arg=$HOME/getauxval.o" >> $GITHUB_ENV

      - name: Build + dist
        run: ./dist.sh

      - name: Bundle with NickelMenu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.4 -R pgaskin/NickelMenu --pattern 'KoboRoot.tgz' --dir /tmp
          ./bundle.sh /tmp/KoboRoot.tgz
          ls -la bundle

      - uses: actions/upload-artifact@v4
        with:
          name: libra2-bundle
          path: bundle/*.zip

      - name: Publish as a GitHub release (easy download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" bundle/*.zip \
            --title "Libra 2 bundle #${{ github.run_number }}" \
            --notes "Unzip into the root of the Kobo USB drive, eject, wait for the reboot. Stock Nickel stays as fallback." \
            --prerelease

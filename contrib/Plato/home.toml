# Home screen settings. Edit and restart Plato.
greeting = "Hello, Josh"
# PNG image (put it in .adds/plato/). Leave "" for no background.
background = "home-bg.png"
show-clock = true
show-book = true
# Private ICS address of your Google Calendar (Settings > your calendar > Secret address in iCal format). Needs WiFi on.
calendar-url = ""

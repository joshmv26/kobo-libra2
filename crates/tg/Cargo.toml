[package]
name = "plato-tg"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "plato-tg"
path = "src/main.rs"

[dependencies]
grammers-client = "0.12.0"
grammers-mtsender = "0.12.0"
grammers-session = { version = "0.12.0", default-features = false, features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "fs", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
